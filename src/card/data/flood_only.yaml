# The main CARD inversion, as a run config.
#
# This file ships with the package.  `card init myrun.yaml` writes a copy you
# can edit, and `card fit myrun.yaml` runs it:
#
#     card init myrun.yaml
#     card fit myrun.yaml
#
# It is the config-file form of examples/run_card_mcmc.py: the flood-only limit
# of the general model, fitted to two matched date pairs.  For a quick look
# without sampling, `card calibrate myrun.yaml` solves the same two constraints
# exactly, in milliseconds.
#
# Naming rule: a value ending in `_age` is an AGE (years before present), one
# ending in `_date` is a DATE (years after Day 1 of Creation).  Anywhere a
# number is expected you may write one of these chronology names instead, which
# is why `t_F: flood_start_date` is safer than `t_F: 1656`.

chronology:
  age_of_earth: 6056
  flood_start_date: 1656
  flood_end_date: 1657
  ice_age_end_date: 3500

constraints:
  # Rocks formed at the Flood's onset appear ~540 Myr old (Precambrian-Cambrian).
  - young_age: flood_start_age        # 4400 YBP under the chronology above
    secular_age: 540.0e6
    uncertainty: 1.0e7
    label: Precambrian-Cambrian boundary
  # Rocks from the end of the Ice Age appear ~11.5 kyr old.
  - young_age: ice_age_end_age        # 2556 YBP
    secular_age: 11500.0
    uncertainty: 30.0
    label: end of the Ice Age

# Flood-only limit: no Creation-week acceleration, and a rate held constant
# across the Flood year (k_F: 0.0) so that two matched pairs determine the two
# remaining unknowns exactly.  Free k_F instead and you need a third pair --
# see `solve_flood_rate`.
# Linear units, whatever space the parameter is sampled in.
fixed:
  lambda_c: 1.0
  k_c: 0.0
  k_F: 0.0
  t_c: 1.0
  t_F: flood_start_date
  t_F2: flood_end_date

# lambda_F and k_PF are log-scale parameters, so these priors are in log10.
priors:
  lambda_F: {mean: 6.0, sigma: 1.0}
  k_PF: {mean: -3.0, sigma: 1.0}

sampler:
  n_walkers: 32
  n_steps: 20000
  burn_in: 5000
  seed: 20260731
  # Start the walkers at the exact solution to these two constraints rather
  # than at the prior means.  This is not a convenience: started from the prior
  # means, about a quarter of the walkers fall into a far local maximum (tiny
  # lambda_F with a k_PF so small the rate never relaxes) that fits the Ice Age
  # and misses the Flood by ~50 sigma, and they can never climb back out.
  initial_guess: calibrate

output:
  directory: mcmc_output
  figures: true
