name: tests

# Runs the pytest suite on every push to main and every pull request.
# The suite is deliberately fast (a few seconds): the MCMC is exercised by
# tests/test_mcmc_smoke.py at 8 walkers x 60 steps rather than by the
# production settings in examples/run_card_mcmc.py.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous, still-running job.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.10 is the floor declared in pyproject; 3.14 is what the project is
        # currently developed on, so CI covers both ends rather than neither.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        # MPLBACKEND=Agg keeps the figure tests off any windowing system.
        # plotting.py deliberately never calls matplotlib.use() itself, since
        # that would override a host application's backend process-wide.
        env:
          MPLBACKEND: Agg
        run: python -m pytest -ra

      - name: Check the CLI is installed and runnable
        run: |
          card --version
          card calibrate examples/flood_only.yaml
