[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-model"
version = "0.1.0"
description = "Calibrating Accelerated Radiometric Decay (CARD): forward/inverse radiometric age modeling under time-varying decay rates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Rick Sanders" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "emcee",
    "corner",
    "h5py",  # MCMC chains are stored as HDF5 (card.inference)
    "pyyaml",  # run configs for `card fit` (card.config); imported lazily
]

[project.scripts]
card = "card.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
docs = [
    "jupyter",  # needed by Quarto to render docs/paper/CARD_model.qmd
    "pyyaml",   # Quarto's own jupyter bootstrap imports yaml before starting the kernel
    "mkdocs-material",       # the documentation site (mkdocs.yml)
    "mkdocstrings[python]",  # API reference generated from the docstrings
    "black",                 # mkdocstrings uses it to format rendered signatures
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
